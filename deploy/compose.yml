name: flowxis

services:
  postgres-16:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-flowxis}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-motion_user} -d $${POSTGRES_DB:-flowxis}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-7:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nestjs-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command:
      - sh
      - -c
      - "./apps/api/node_modules/.bin/prisma migrate deploy --config apps/api/prisma.config.ts && node apps/api/dist/main.js"
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-motion_user}:${POSTGRES_PASSWORD:-change_me_local_password}@postgres-16:5432/${POSTGRES_DB:-flowxis}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis-7:6379}
      RUNNINGHUB_API_KEY: ${RUNNINGHUB_API_KEY:-}
      RUNNINGHUB_API_HOST: ${RUNNINGHUB_API_HOST:-}
      RH_BALANCE_ALERT_USD: ${RH_BALANCE_ALERT_USD:-10}
      RH_BALANCE_ENDPOINT: ${RH_BALANCE_ENDPOINT:-/uc/openapi/accountStatus}
      ADMIN_ADJUST_MAX: ${ADMIN_ADJUST_MAX:-30000}
      USD_VND: ${USD_VND:-25000}
      BENCHMARK_USER_EMAILS: ${BENCHMARK_USER_EMAILS:-}
      RUNNINGHUB_WORKFLOW_FACESWAP: ${RUNNINGHUB_WORKFLOW_FACESWAP:-}
      RUNNINGHUB_INSTANCE_FACE_SWAP: ${RUNNINGHUB_INSTANCE_FACE_SWAP:-default}
      RUNNINGHUB_WORKFLOW_OUTFIT_CHANGE: ${RUNNINGHUB_WORKFLOW_OUTFIT_CHANGE:-}
      RUNNINGHUB_INSTANCE_OUTFIT_CHANGE: ${RUNNINGHUB_INSTANCE_OUTFIT_CHANGE:-default}
      RUNNINGHUB_WORKFLOW_BODY_RESHAPE: ${RUNNINGHUB_WORKFLOW_BODY_RESHAPE:-}
      RUNNINGHUB_INSTANCE_BODY_RETOUCH: ${RUNNINGHUB_INSTANCE_BODY_RETOUCH:-default}
      RUNNINGHUB_WORKFLOW_MOTION: ${RUNNINGHUB_WORKFLOW_MOTION:-}
      RUNNINGHUB_INSTANCE_MOTION_CONTROL: ${RUNNINGHUB_INSTANCE_MOTION_CONTROL:-default}
      RUNNINGHUB_WORKFLOW_MOTION_V2: ${RUNNINGHUB_WORKFLOW_MOTION_V2:-}
      RUNNINGHUB_INSTANCE_MOTION_CONTROL_V2: ${RUNNINGHUB_INSTANCE_MOTION_CONTROL_V2:-default}
      RUNNINGHUB_WORKFLOW_REMOVE_WATERMARK: ${RUNNINGHUB_WORKFLOW_REMOVE_WATERMARK:-}
      RUNNINGHUB_INSTANCE_REMOVE_WATERMARK: ${RUNNINGHUB_INSTANCE_REMOVE_WATERMARK:-default}
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres-16:
        condition: service_healthy
      redis-7:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/health').then(r => r.json()).then(b => process.exit(b.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  nestjs-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-motion_user}:${POSTGRES_PASSWORD:-change_me_local_password}@postgres-16:5432/${POSTGRES_DB:-flowxis}?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis-7:6379}
      RUNNINGHUB_API_KEY: ${RUNNINGHUB_API_KEY:-}
      RUNNINGHUB_API_HOST: ${RUNNINGHUB_API_HOST:-}
      RH_BALANCE_ALERT_USD: ${RH_BALANCE_ALERT_USD:-10}
      RH_MAX_CONCURRENT: ${RH_MAX_CONCURRENT:-85}
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      RH_BALANCE_ENDPOINT: ${RH_BALANCE_ENDPOINT:-/uc/openapi/accountStatus}
      RUNNINGHUB_WORKFLOW_FACESWAP: ${RUNNINGHUB_WORKFLOW_FACESWAP:-}
      RUNNINGHUB_INSTANCE_FACE_SWAP: ${RUNNINGHUB_INSTANCE_FACE_SWAP:-default}
      RUNNINGHUB_WORKFLOW_OUTFIT_CHANGE: ${RUNNINGHUB_WORKFLOW_OUTFIT_CHANGE:-}
      RUNNINGHUB_INSTANCE_OUTFIT_CHANGE: ${RUNNINGHUB_INSTANCE_OUTFIT_CHANGE:-default}
      RUNNINGHUB_WORKFLOW_BODY_RESHAPE: ${RUNNINGHUB_WORKFLOW_BODY_RESHAPE:-}
      RUNNINGHUB_INSTANCE_BODY_RETOUCH: ${RUNNINGHUB_INSTANCE_BODY_RETOUCH:-default}
      RUNNINGHUB_WORKFLOW_MOTION: ${RUNNINGHUB_WORKFLOW_MOTION:-}
      RUNNINGHUB_INSTANCE_MOTION_CONTROL: ${RUNNINGHUB_INSTANCE_MOTION_CONTROL:-default}
      RUNNINGHUB_WORKFLOW_MOTION_V2: ${RUNNINGHUB_WORKFLOW_MOTION_V2:-}
      RUNNINGHUB_INSTANCE_MOTION_CONTROL_V2: ${RUNNINGHUB_INSTANCE_MOTION_CONTROL_V2:-default}
      RUNNINGHUB_WORKFLOW_REMOVE_WATERMARK: ${RUNNINGHUB_WORKFLOW_REMOVE_WATERMARK:-}
      RUNNINGHUB_INSTANCE_REMOVE_WATERMARK: ${RUNNINGHUB_INSTANCE_REMOVE_WATERMARK:-default}
    depends_on:
      postgres-16:
        condition: service_healthy
      redis-7:
        condition: service_healthy

  # Frontend Nuxt (NUXT_PUBLIC_* được nạp lúc build, đổi giá trị thì phải build lại).
  nuxt-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-}
        NUXT_PUBLIC_REPORT_EMAIL: ${NUXT_PUBLIC_REPORT_EMAIL:-}
        NUXT_PUBLIC_ZALO_URL: ${NUXT_PUBLIC_ZALO_URL:-}
        NUXT_PUBLIC_GTAG_ID: ${NUXT_PUBLIC_GTAG_ID:-}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-}
      NUXT_PUBLIC_REPORT_EMAIL: ${NUXT_PUBLIC_REPORT_EMAIL:-}
      NUXT_PUBLIC_ZALO_URL: ${NUXT_PUBLIC_ZALO_URL:-}
      NUXT_PUBLIC_GTAG_ID: ${NUXT_PUBLIC_GTAG_ID:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
